# How often Prometheus pulls (scrapes) metrics from every target below.
global:
  scrape_interval: 15s

scrape_configs:
  # A "job" is a named group of targets. This one scrapes our backend's
  # /metrics endpoint. "backend" here is the docker-compose service name,
  # which Docker's internal DNS resolves for us on the shared network.
  - job_name: "echo-room-backend"
    static_configs:
      - targets: ["backend:8000"]

  # Prometheus can also monitor itself.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
