# Tells Grafana to auto-load any dashboard JSON files placed in this folder
# on startup, instead of requiring manual import through the UI.
apiVersion: 1

providers:
  - name: "Echo Room"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
